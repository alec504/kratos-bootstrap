syntax = "proto3";

package conf.v1;

import "google/protobuf/duration.proto";

option go_package = "github.com/alec504/kratos-bootstrap/api/gen/go/conf/v1;confv1";

message Middleware {
  // JWT校验
  message Auth {
    string method = 1; // JWT签名的算法，支持算法：HS256
    string key = 2; // JWT 秘钥
  }

  // 限流器
  message RateLimiter {
    string name = 1; // 限流器名字，支持：bbr。
  }

  // 性能指标
  message Metrics {
    bool histogram = 1; // 直方图
    bool counter = 2; // 计数器
    bool gauge = 3; // 仪表盘
    bool summary = 4; // 摘要
  }

  // singleFlight
  message HttpCache {
    bool enable = 1;
    google.protobuf.Duration expire = 2;
    string store = 3;
    string prefix_key = 4;
  }

  // Tracing
  message Tracing {
    // HTTP/gRPC 通用链路追踪精确排除 operation，匹配 transport.Operation()。
    repeated string exclude_operations = 1;
    // HTTP/gRPC 通用链路追踪前缀排除 operation，匹配 transport.Operation()。
    repeated string exclude_operation_prefixes = 2;
  }

  bool enable_logging = 1; // 日志开关
  bool enable_recovery = 2; // 异常恢复
  bool enable_tracing = 3; // 链路追踪开关
  bool enable_validate = 4; // 参数校验开关
  bool enable_circuit_breaker = 5; // 熔断器
  bool enable_metadata = 9; // 元数据

  RateLimiter limiter = 6;
  Metrics metrics = 7;
  Auth auth = 8;
  HttpCache http_cache = 10;
  Tracing tracing = 11;
}
